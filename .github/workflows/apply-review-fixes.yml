name: Apply complete PR review fixes

on:
  push:
    branches:
      - perf/runtime-streaming-rum-deps
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[review-fixes-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/runtime-streaming-rum-deps
          fetch-depth: 0

      - name: Expand and verify reviewed source files
        run: bash scripts/apply-review-fixes.sh

      - name: Replace staging files with the actual remediation
        run: |
          rm -rf .review-payload
          rm -f scripts/apply-review-fixes.sh
          rm -f .github/workflows/apply-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "fix: apply complete gameplay remediation [review-fixes-applied]"
          git push origin HEAD:perf/runtime-streaming-rum-deps
