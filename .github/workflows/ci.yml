name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/**"
      - ".gitignore"
      - ".prettier*"
      - "assets/**"
      - "client/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright*.config.ts"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".gitignore"
      - ".prettier*"
      - "assets/**"
      - "client/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright*.config.ts"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository hygiene
        run: pnpm repo:check

      - name: Puzzle archive consistency
        run: pnpm puzzles:check

      - name: Source formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit and puzzle validation tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install browser runtimes
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Browser interaction tests
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright test

      - name: Production-server browser test
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e:production
