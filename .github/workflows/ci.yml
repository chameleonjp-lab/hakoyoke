name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/**"
      - ".gitignore"
      - ".prettier*"
      - "assets/**"
      - "client/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright*.config.ts"
      - "ranking-manifest.json"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".gitignore"
      - ".prettier*"
      - "assets/**"
      - "client/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright*.config.ts"
      - "ranking-manifest.json"
      - "scripts/**"
      - "server/**"
      - "shared/**"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Fresh Ubuntu runners may spend about 20 minutes installing WebKit system dependencies.
    # Leave time for the cross-browser and production-server checks afterward.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Repository hygiene
        run: pnpm repo:check

      - name: Puzzle archive consistency
        run: pnpm puzzles:check

      - name: Ranking manifest consistency
        run: pnpm ranking:check

      - name: Source formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit and puzzle validation tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          # Build the same base-path variant that GitHub Pages serves. The
          # production server also serves this build at / for E2E checks.
          VITE_BASE_PATH: /hakoyoke/

      - name: Verify production build excludes Manus runtime assets
        run: test ! -e dist/public/__manus__

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-site-${{ github.sha }}
          path: dist/public
          if-no-files-found: error
          retention-days: 1

      - name: Install browser runtimes
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install pull request browser runtime
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium

      - name: Pull request browser interaction tests
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright test --project=chromium

      - name: Browser interaction tests
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright test

      - name: Production-server browser test
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e:production
